name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  python3:
    name: Python 3.13
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Runs in the same Docker image as local runs, so CI and local results match.
      # Fails if branch coverage drops below the minimum.
      - run: scripts/test -v --cov --cov-fail-under=98

  template:
    name: Template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install cfn-lint==1.*
      - run: cfn-lint template.yaml
