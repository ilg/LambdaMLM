# End-to-end test environments.  Copy to ~/.config/lambdamlm-test/e2e.ini.
#
# Each section is a LambdaMLM deployment to test against.  The test tooling
# adds SES receipt rules (named lambdamlm-e2e-*) to the start of the active
# rule set, so mail to the inbox addresses is stored in a test bucket instead
# of reaching LambdaMLM, and creates that bucket.  `scripts/e2e teardown`
# removes both.

[example]
# AWS CLI profile and region of the deployment.
profile = my-test-account
region = us-west-2
# The active SES receipt rule set (only the active one receives mail).
rule_set = default-rule-set
# The deployment's bucket, where test lists are created.
list_bucket = my-lambdamlm-bucket
# Addresses the test inboxes receive at.  They must be on domains SES receives
# mail for, and shouldn't be list addresses.
inboxes = e2e-inbox-1@lists.example.org, e2e-inbox-2@lists.example.org
# The deployment's function, for API calls.  (For a SAM stack, it's the
# FunctionName output.)
function = LambdaMLM
# Its log group, if it isn't /aws/lambda/<function>.  (For a SAM stack, it's
# /aws/lambda/<stack name>-function.)
# log_group = /aws/lambda/LambdaMLM-function
# The bucket for the test inboxes; defaults to lambdamlm-e2e-inbox-<account>-<region>.
# inbox_bucket = my-e2e-inbox-bucket
